services:

  # ── PostgreSQL — MLflow backend metadata store ────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: mlflow_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  # ── MinIO — S3-compatible artifact storage ────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # ── MinIO Init — creates the mlflow-artifacts bucket ──
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/mlflow-artifacts;
        echo 'Bucket ready.';
      "

  # ── MLflow Tracking Server ────────────────────────────
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install -q mlflow psycopg2-binary boto3 &&
               mlflow server
               --backend-store-uri postgresql://mlflow:mlflow123@postgres/mlflow_db
               --default-artifact-root s3://mlflow-artifacts/
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"   # MLflow UI
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ── Training Service ──────────────────────────────────
  trainer:
    build: ./trainer
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    depends_on:
      - mlflow
    profiles:
      - training   # Only starts when explicitly requested

  # ── Prediction API ────────────────────────────────────
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MODEL_NAME=IrisClassifier
      - MODEL_STAGE=Production
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
