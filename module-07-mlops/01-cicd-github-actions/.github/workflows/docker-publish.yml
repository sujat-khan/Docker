name: Build, Test & Push Docker Image

# ── TRIGGER ────────────────────────────────────────────
# Runs on every push to main, and on pull requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── GLOBAL ENV ─────────────────────────────────────────
env:
  IMAGE_NAME: ${{ github.repository }}   # e.g. "yourusername/cicd-demo"

# ── JOBS ───────────────────────────────────────────────
jobs:

  # ── JOB 1: Run tests ─────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── JOB 2: Build & Push Docker image ─────────────────
  # This only runs if:
  #   a) The "test" job passed
  #   b) We are pushing to main (not a pull request)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=git-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
